<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOC Console — Authenticate</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #060b18;
            --bg-grid: rgba(56, 189, 248, 0.04);
            --panel: #0f172a;
            --border: #1e293b;
            --accent: #38bdf8;
            --text: #e5e7eb;
            --muted: #64748b;
            --ok: #22c55e;
            --err: #ef4444;
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: var(--bg);
            color: var(--text);
            font-family: 'JetBrains Mono', ui-monospace, 'Courier New', monospace;
            font-weight: 400;
            overflow: hidden;
        }

        /* Grid background, faded toward edges */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(var(--bg-grid) 1px, transparent 1px),
                linear-gradient(90deg, var(--bg-grid) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            pointer-events: none;
            z-index: 0;
        }

        /* Soft cyan glow behind card */
        body::after {
            content: '';
            position: fixed;
            top: 50%;
            left: 50%;
            width: 600px;
            height: 600px;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(56, 189, 248, 0.08) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .wrap {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 28px;
            font-size: 12px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .brand .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--ok);
            box-shadow: 0 0 12px var(--ok);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .card {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(180deg, rgba(15,23,42,0.92) 0%, rgba(15,23,42,0.75) 100%);
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 36px 32px;
            backdrop-filter: blur(8px);
            box-shadow:
                0 0 0 1px rgba(56, 189, 248, 0.05),
                0 20px 60px rgba(0, 0, 0, 0.5);
            position: relative;
            animation: rise 0.5s ease-out;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Corner accents */
        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: var(--accent);
            border-style: solid;
        }
        .card::before {
            top: -1px; left: -1px;
            border-width: 1px 0 0 1px;
        }
        .card::after {
            bottom: -1px; right: -1px;
            border-width: 0 1px 1px 0;
        }

        h1 {
            margin: 0 0 6px 0;
            font-size: 22px;
            font-weight: 500;
            color: var(--text);
            letter-spacing: 0.02em;
        }

        h1 .shield {
            color: var(--accent);
        }

        .subtitle {
            margin: 0 0 28px 0;
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 10px;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 14px;
            font-family: inherit;
            font-size: 14px;
            border-radius: 2px;
            outline: none;
            transition: all 0.15s ease;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
            background: rgba(0, 0, 0, 0.5);
        }

        input::placeholder {
            color: #475569;
        }

        button {
            width: 100%;
            margin-top: 8px;
            background: var(--accent);
            color: #060b18;
            border: none;
            padding: 13px 14px;
            font-family: inherit;
            font-weight: 700;
            font-size: 12px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            border-radius: 2px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        button:hover {
            background: #7dd3fc;
            box-shadow: 0 0 24px rgba(56, 189, 248, 0.4);
        }

        button:active {
            transform: translateY(1px);
        }

        .error {
            margin-bottom: 18px;
            padding: 10px 12px;
            background: rgba(239, 68, 68, 0.08);
            border-left: 2px solid var(--err);
            color: #fca5a5;
            font-size: 12px;
            border-radius: 2px;
        }

        .footer {
            margin-top: 22px;
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            text-align: center;
        }

        .footer span {
            color: var(--accent);
        }
    </style>
</head>
<body>

<div class="wrap">

    <div class="brand">
        <span class="dot"></span>
        <span>SOCFortress // Secure Console</span>
    </div>

    <form class="card" method="POST" action="{{ url_for('login') }}" autocomplete="off">

        <h1><span class="shield">▣</span> Authenticate</h1>
        <p class="subtitle">Restricted Access · Authorized Personnel</p>

        {% if error %}
        <div class="error">! {{ error }}</div>
        {% endif %}

        <div class="field">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" placeholder="analyst" autofocus required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="••••••••" required>
        </div>

        <button type="submit">Sign In →</button>

        <div class="footer">
            Session: <span>encrypted</span> · TLS-pending
        </div>

    </form>

</div>

</body>
</html>
